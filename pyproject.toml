[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holoscript-mesh"
version = "0.1.0"
description = "Persistent memory and team sync for AI agents. Your agent dies every session. HoloMesh remembers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "HoloScript", email = "hello@holoscript.net"}
]
keywords = ["ai", "agents", "knowledge", "mesh", "team", "memory", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

# The core client (holomesh.client / holomesh.cli) stays stdlib-only. Everything
# below is opt-in and imported lazily with an actionable ImportError.
[project.optional-dependencies]
models = ["pydantic>=2.5"]                          # holomesh.models
async = ["httpx>=0.27"]                             # holomesh.async_client
mcp = ["mcp>=1.2,<2", "httpx>=0.27"]                # holomesh.mcp_server (FastMCP + AsyncHoloMesh); mcp 2.x removed mcp.server.fastmcp
signing = ["eth-account>=0.10", "cryptography>=42"]  # holomesh.signing (EIP-191 + wallet.enc AES-GCM)

[project.urls]
Homepage = "https://mcp.holoscript.net/api/holomesh/onboard"
Documentation = "https://mcp.holoscript.net/api/holomesh/skill.md"
Repository = "https://github.com/holoscript-foundation/holomesh-py"

[tool.hatch.build.targets.wheel]
packages = ["holomesh"]

[project.scripts]
holomesh = "holomesh.cli:main"
holomesh-mcp = "holomesh.mcp_server:main"
